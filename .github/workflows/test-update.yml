name: Test Upgrade from PR to 6.0.0-alpha

on:
  pull_request:
    branches:
      - 5.2

permissions:
  contents: read
  actions: write

jobs:

  release:
    permissions:
      contents: write  # for actions/create-release to create a release
    name: Create draft release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      # Our build script needs access to all previous tags, so we add fetch-depth: 0
      with:
        fetch-depth: 0
    
    - name: Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.1
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql, pdo_mysql

    - name: Install dependencies
      run: |
        composer validate
        composer install --prefer-dist --no-progress --no-suggest

    - name: Get minimum Mautic version
      run: |
        echo "MAUTIC_MINIMUM_VERSION=$(jq -r '.minimum_mautic_version' app/release_metadata.json)" >> $GITHUB_ENV

    - name: "Download and extract minimum Mautic version: ${{ env.MAUTIC_MINIMUM_VERSION }}"
      run: |
        curl -sSL https://github.com/mautic/mautic/releases/download/${{ env.MAUTIC_MINIMUM_VERSION }}/${{ env.MAUTIC_MINIMUM_VERSION }}.zip -o ${{ env.MAUTIC_MINIMUM_VERSION }}.zip
        unzip -q ${{ env.MAUTIC_MINIMUM_VERSION }}.zip -d ./mautic-minimum-version

    - name: Build release files
      run: |
        php build/package_release_test.php

  test-update:
    name: Test Update
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: mautictest
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.1
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql, pdo_mysql

    - name: Install dependencies
      run: |
        composer validate
        composer install --prefer-dist --no-progress --no-suggest

    - name: Prepare testing environment
      run: |
        cp .github/ci-files/local.php config/local.php

    - name: Install from PR code
      env:
        DB_PORT: ${{ job.services.mysql.ports[3306] }}
      run: |
        php bin/console mautic:install --force http://localhost

    - name: Download official 6.0.0-alpha update
      run: |
        curl -sSOL https://github.com/mautic/mautic/releases/download/6.0.0-alpha/6.0.0-alpha-update.zip
  
    - name: Modify update package
      run: |
        # Extract the official update zip
        unzip 6.0.0-alpha-update.zip -d mautic-update

        existing=$(cat mautic-update/deleted_files.txt | jq -c .)
        updated=$(echo $existing | jq '. + ["vendor/symfony/cache/Adapter/DoctrineAdapter.php"]')
        echo $updated > mautic-update/deleted_files.txt

        cat mautic-update/deleted_files.txt | grep 'DoctrineAdapter.php'

        cp fix-update/FinalizeUpdateStep.php mautic-update/app/bundles/CoreBundle/Update/Step/FinalizeUpdateStep.php

        # Re-zip the modified update package
        cd mautic-update && zip -r ../6.0.0-alpha-update-modified.zip ./*
        cd ..
  
        # Replace original zip with modified one
        mv 6.0.0-alpha-update-modified.zip 6.0.0-alpha-update.zip
  
    - name: Apply modified update
      env:
        DB_PORT: ${{ job.services.mysql.ports[3306] }}
      run: |
        php bin/console mautic:update:apply --force --update-package=6.0.0-alpha-update.zip

    - name: Check DoctrineAdapter.php file
      env:
        DB_PORT: ${{ job.services.mysql.ports[3306] }}
      run: |
        if [ -f vendor/symfony/cache/Adapter/DoctrineAdapter.php ]; then
          echo "DoctrineAdapter.php exists."
        else
          echo "DoctrineAdapter.php does not exist."
        fi || true

    - name: Apply modified update
      env:
        DB_PORT: ${{ job.services.mysql.ports[3306] }}
      run: |
        php bin/console mautic:update:apply --finish